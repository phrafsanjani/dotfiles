[modules]
left = [ [ "appLauncher", "Updates", "Workspaces" ] ]
center = [ "WindowTitle" ]
right = [ "MediaPlayer", [ "Tray", "KeyboardLayout", "SystemInfo", "Notifications", "Tempo", "Privacy", "Settings" ] ]

[appearance]
scale_factor = 1.15

[workspaces]
indicator_format = "NameAndIcons"

[keyboard_layout.labels]
"English (US)" = "🇺🇸"
"Persian" = "🇮🇷"

[system_info.temperature]
units = "Celsius"

[notifications]
show_timestamps = true
show_bodies = false
grouped = true
toast = true
toast_position = "TopRight"
toast_timeout = 4000
toast_limit = 5
toast_max_height = 150
blocklist = ["blueman", "^org\\.gnome\\."]

[media_player]
max_text_length = 35
indicator_visualizer = "Background"
menu_visualizer = true

[updates]
check_cmd = "checkupdates; yay -Qua"
update_cmd = 'ghostty -e bash -c "yay; echo Done - Press enter to exit; read" &'

[settings]
lock_cmd = "loginctl lock-session"
