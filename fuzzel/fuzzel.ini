[main]
font=sans-serif:size=11
prompt="❯ "
icon-theme=Adwaita
width=35
horizontal-pad=20
vertical-pad=14
inner-pad=10
layer=top

[colors]
# RRGGBBAA - 'd0' gives ~80% opacity, allowing the blurred background to show
background=1e1e2ed0
text=cdd6f4ff
match=89b4faff
selection=585b70a0
selection-text=cdd6f4ff
selection-match=89b4faff
# Subtle semi-transparent border gives the glass edge highlight
border=ffffff33

[border]
width=1
radius=12
