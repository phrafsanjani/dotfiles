font_size        12.0

# Window Layout & Padding
window_padding_width 10
single_window_margin_width -1
hide_window_decorations yes
remember_window_size  yes
background_opacity 0.85

# Performance & Rendering
sync_to_monitor yes
input_delay 2
repaint_delay 10

# Cursor & Mouse
cursor_shape beam
cursor_blink_interval 0.5
mouse_hide_wait 3.0

# Scrollback
scrollback_lines 10000

# Color Scheme (Deep Dark with Accent Palette)
background           #1a1d27
foreground           #e2e8f0

# Selection
selection_background #5b7cff
selection_foreground #1a1d27

# Cursor
cursor               #a78bfa
cursor_text_color    #1a1d27

# Normal Colors
color0  #1e2230
color1  #f87171
color2  #4ade80
color3  #facc15
color4  #5b7cff
color5  #a78bfa
color6  #38bdf8
color7  #94a3b8

# Bright Colors
color8  #475569
color9  #ef4444
color10 #22c55e
color11 #eab308
color12 #7c9aff
color13 #b87cfc
color14 #0ea5e9
color15 #f8fafc

# Tab Bar Styling
tab_bar_style powerline
tab_powerline_style angled
tab_active_background   #5b7cff
tab_active_foreground   #1a1d27
tab_inactive_background #1e2230
tab_inactive_foreground #94a3b8
